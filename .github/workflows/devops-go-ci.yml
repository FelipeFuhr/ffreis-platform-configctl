name: DevOps / Go CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod-tidy:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-mod-tidy-check.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: "1.25"
      working-directory: "."

  fmt:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-fmt.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: "1.25"
      working-directory: "."

  lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # scan-fix(ci:goinstall-v2-module-path): dropped install-mode: goinstall —
        # see the identical fix + full explanation in ci.yml's golangci-lint step.
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.12.1
          args: --path-prefix=. --timeout=5m

  test:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      id-token: write # scan-fix(permissions-mirror): go-test.yml needs this for L2 S3 cache OIDC
    needs: [fmt]
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-test.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: "1.25"
      working-directory: "."

  coverage:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    needs: [fmt]
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-coverage.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: "1.25"
      working-directory: "."
      coverage-threshold: 75

  integration-coverage:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    needs: [fmt]
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-integration-coverage.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: "1.25"
      working-directory: "."
      coverage-threshold: 75
